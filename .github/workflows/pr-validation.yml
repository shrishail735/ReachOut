name: PR validation

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  frontend-tests-and-build:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reachout-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: reachout-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

  backend-tests-and-build:
    name: Backend tests and build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - Backend/api-gateway
          - Backend/eureka-server
          - Backend/email-fetcher-service
          - Backend/notification-service
          - Backend/reachOut

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            Backend/api-gateway/pom.xml
            Backend/eureka-server/pom.xml
            Backend/email-fetcher-service/pom.xml
            Backend/notification-service/pom.xml
            Backend/reachOut/pom.xml

      - name: Run Maven tests and package for ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x mvnw || true
          ./mvnw test
          ./mvnw package -DskipTests
