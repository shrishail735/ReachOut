version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: reachout-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Password
      MYSQL_DATABASE: Name
    ports:
      - "3307:3306"   # 3307 externally so it doesn't clash with local MySQL
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reachout-redis
    ports:
      - "6380:6379"   # 6380 externally so it doesn't clash with local Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  job-service:
    build: ./job-service
    container_name: reachout-job-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/reachout_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Reachout123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: gerbil.rmq.cloudamqp.com
      SPRING_RABBITMQ_PORT: 5671
      SPRING_RABBITMQ_USERNAME: RABBITMQ_USERNAME
      SPRING_RABBITMQ_PASSWORD: RABBITMQ_PASSWORD
      SPRING_RABBITMQ_VIRTUAL_HOST: RABBITMQ_VIRTUAL_HOST
      SPRING_RABBITMQ_SSL_ENABLED: "true"
      JWT_SECRET: reachout-super-secret-jwt-key-minimum-256-bits-long
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: reachout-notification-service
    ports:
      - "8082:8082"
    environment:
      SPRING_RABBITMQ_HOST: gerbil.rmq.cloudamqp.com
      SPRING_RABBITMQ_PORT: 5671
      SPRING_RABBITMQ_USERNAME: RABBITMQ_USERNAME
      SPRING_RABBITMQ_PASSWORD: RABBITMQ_PASSWORD
      SPRING_RABBITMQ_VIRTUAL_HOST: RABBITMQ_VIRTUAL_HOST
      SPRING_RABBITMQ_SSL_ENABLED: "true"
      SPRING_MAIL_USERNAME: your_gmail@gmail.com
      SPRING_MAIL_PASSWORD: your_app_password

  api-gateway:
    build: ./api-gateway
    container_name: reachout-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - job-service
      - notification-service

volumes:
  mysql-data: